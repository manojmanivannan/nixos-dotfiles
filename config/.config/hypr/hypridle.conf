# WF-14 — auto-lock-on-idle. Caelestia ships no idle *daemon* it owns end to
# end (its IdleMonitors.qml is disabled via `general.idle.timeouts = []` in
# home-manager/modules/caelestia.nix so the 180s default lock / 600s
# suspend-then-hibernate don't race this listener), so hypridle stays the idle
# daemon per the build spec (WF-8 Solution: Idle). On idle timeout the session
# locks through caelestia's `Lock` module: `loginctl lock-session` emits logind's
# `Lock` signal, which caelestia's SessionManager bridges to
# `WlSessionLock.locked` (plugin/src/Caelestia/Services/sessionmanager.cpp ->
# IdleMonitors.qml `onLockRequested`). Retiring hyprlock (WF-14) is what makes
# this route exclusively caelestia's.
#
# Build-phase risk #5 (WF-8) asked to confirm the exact caelestia CLI/IPC lock
# subcommand and use it here. Confirmed: `caelestia shell lock lock` ->
# `qs -c caelestia ipc call lock lock` -> Lock.qml `IpcHandler target:"lock"` ->
# `lock.locked = true`. That subcommand is non-functional in this Nix setup,
# though: `qs` isn't on the user PATH (quickshell is only a buildInput of the
# shell package, not propagated), and `qs -c caelestia` resolves
# `~/.config/quickshell/caelestia/shell.qml` — which doesn't exist (the running
# shell launches with `-p <store>/share/caelestia-shell`, a different config
# path, so the IPC socket pathId wouldn't match the running instance either).
# `loginctl lock-session` reaches the same caelestia `Lock` module through the
# standard, dependency-free logind bridge, so it is the trigger used here.
listener {
    timeout = 600                              # ~10 min idle (user story #13).
    on-timeout = loginctl lock-session          # lock via caelestia's Lock module.
    # No on-resume: the old `notify-send "Welcome back!"` toast is noise once
    # the lock screen is up (resume = the user unlocking it). The spec (WF-8)
    # marks on-resume optional.
}