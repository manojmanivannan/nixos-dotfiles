# hyprpaper wallpaper daemon config.
# Launched from hypr/hyprland.lua on hyprland.start ("waybar & hyprpaper").
#
# hyprpaper does not expand $HOME or ~ in paths, so the image is referenced
# by its absolute path in the dotfiles repo.

preload = /home/manoj/nixos-dotfiles/home/wallpaper/boat.png

# Empty monitor name (before the comma) applies the wallpaper to every
# output. Use `wallpaper = <monitor>,<path>` to target a specific display.
wallpaper = ,/home/manoj/nixos-dotfiles/home/wallpaper/boat.png

# No splash text over the wallpaper, and allow IPC so wallpapers can be
# swapped at runtime via `hyprctl hyprpaper ...` if desired.
splash = false
ipc = true